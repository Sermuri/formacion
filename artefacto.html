<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Engineering - Curso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #080C14;
            --surface: #0D1525;
            --card: #111827;
            --border: #1E2D45;
            --accent: #00D4FF;
            --accent2: #7C3AED;
            --accent3: #FF2878;
            --text: #E2E8F0;
            --muted: #64748B;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
        }

        /* ═══════════════════════════════════════════════════════════════════ */
        /* ANIMACIONES */
        /* ═══════════════════════════════════════════════════════════════════ */
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes content-reveal {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes blur-in {
            from {
                backdrop-filter: blur(0px);
            }
            to {
                backdrop-filter: blur(8px);
            }
        }

        @keyframes line-expand {
            from {
                width: 0;
                opacity: 0;
            }
            to {
                width: 100%;
                opacity: 1;
            }
        }

        @keyframes line-v-expand {
            from {
                height: 0;
                opacity: 0;
            }
            to {
                height: 100%;
                opacity: 1;
            }
        }

        @keyframes orb-pulse {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.1), inset 0 0 20px rgba(0, 212, 255, 0.05);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
                box-shadow: 0 0 60px rgba(0, 212, 255, 0.4), inset 0 0 60px rgba(0, 212, 255, 0.2);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.3), inset 0 0 40px rgba(0, 212, 255, 0.1);
            }
        }

        @keyframes corner-in {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes text-fade-in {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes dot-bounce {
            0%, 80%, 100% {
                opacity: 0.4;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        @keyframes transition-fade-out {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        /* ═══════════════════════════════════════════════════════════════════ */
        /* FONDO */
        /* ═══════════════════════════════════════════════════════════════════ */
        .bg-anim {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 60% at 15% 15%, rgba(0, 212, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 70% at 85% 85%, rgba(124, 58, 237, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255, 40, 120, 0.04) 0%, transparent 70%);
        }

        /* ═══════════════════════════════════════════════════════════════════ */
        /* TRANSICIÓN ELEGANTE */
        /* ═══════════════════════════════════════════════════════════════════ */
        .transition-state {
            position: fixed;
            inset: 0;
            z-index: 50;
            opacity: 1;
            pointer-events: all;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .transition-state.fade-out {
            animation: transition-fade-out 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .transition-state.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Blur Effect Container */
        .blur-background {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.05) 0%, rgba(124, 58, 237, 0.05) 100%);
            backdrop-filter: blur(0px);
            animation: blur-in 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Animated Lines */
        .transition-lines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
        }

        .line {
            position: absolute;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
        }

        .line-h {
            width: 0;
            height: 2px;
            left: 50%;
            top: 50%;
            transform: translateX(-50%);
            animation: line-expand 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
            box-shadow: 0 0 20px var(--accent);
        }

        .line-v {
            width: 2px;
            height: 0;
            left: 50%;
            top: 50%;
            transform: translateX(-50%) translateY(-50%);
            animation: line-v-expand 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
            box-shadow: 0 0 20px var(--accent2);
        }

        /* Glowing Orb Center */
        .orb {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 30% 30%, rgba(0, 212, 255, 0.3), transparent 70%);
            border: 2px solid rgba(0, 212, 255, 0.2);
            animation: orb-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) 0.6s forwards;
            z-index: 3;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3), inset 0 0 40px rgba(0, 212, 255, 0.1);
        }

        /* Corner Accents */
        .corner-accent {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(0, 212, 255, 0.2);
            opacity: 0;
        }

        .corner-accent.top-left {
            top: 20%;
            left: 5%;
            border-right: none;
            border-bottom: none;
            border-radius: 0 0 20px 0;
            animation: corner-in 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s forwards;
        }

        .corner-accent.top-right {
            top: 20%;
            right: 5%;
            border-left: none;
            border-bottom: none;
            border-radius: 0 0 0 20px;
            animation: corner-in 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.85s forwards;
        }

        .corner-accent.bottom-left {
            bottom: 20%;
            left: 5%;
            border-right: none;
            border-top: none;
            border-radius: 0 20px 0 0;
            animation: corner-in 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.9s forwards;
        }

        .corner-accent.bottom-right {
            bottom: 20%;
            right: 5%;
            border-left: none;
            border-top: none;
            border-radius: 20px 0 0 0;
            animation: corner-in 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.95s forwards;
        }

        /* Loading Text */
        .transition-text {
            position: absolute;
            z-index: 4;
            text-align: center;
            opacity: 0;
            animation: text-fade-in 0.6s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
        }

        .transition-title {
            font-size: 28px;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .transition-subtitle {
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Animated Dots Loader */
        .loader-dots {
            position: absolute;
            z-index: 4;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            opacity: 0;
            animation: text-fade-in 0.6s cubic-bezier(0.4, 0, 0.2, 1) 1.5s forwards;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: dot-bounce 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* ═══════════════════════════════════════════════════════════════════ */
        /* HEADER */
        /* ═══════════════════════════════════════════════════════════════════ */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: linear-gradient(180deg, rgba(13, 21, 37, 0.7) 0%, rgba(8, 12, 20, 0.5) 100%);
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 700;
            font-size: 16px;
            color: var(--accent);
            letter-spacing: 0.3px;
        }

        .header-left span:first-child {
            font-size: 20px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .header-title {
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 1.2px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .btn-back {
            padding: 10px 22px;
            border-radius: 10px;
            border: 1px solid rgba(0, 212, 255, 0.35);
            background: rgba(0, 212, 255, 0.08);
            color: var(--accent);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.15);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-back:hover {
            background: rgba(0, 212, 255, 0.15);
            box-shadow: 0 0 24px rgba(0, 212, 255, 0.3);
            border-color: rgba(0, 212, 255, 0.5);
        }

        .btn-consultas {
            padding: 10px 22px;
            border-radius: 10px;
            border: 1px solid rgba(255, 40, 120, 0.35);
            background: rgba(255, 40, 120, 0.08);
            color: var(--accent3);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(255, 40, 120, 0.15);
            letter-spacing: 0.5px;
        }

        .btn-consultas:hover {
            background: rgba(255, 40, 120, 0.15);
            box-shadow: 0 0 24px rgba(255, 40, 120, 0.3);
            border-color: rgba(255, 40, 120, 0.5);
        }

        /* ═══════════════════════════════════════════════════════════════════ */
        /* MODAL */
        /* ═══════════════════════════════════════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--card);
            border: 1.5px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            padding: 32px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.25);
            animation: fade-in-up 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 24px;
            padding: 0;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-close:hover {
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1.3px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-input-wrapper {
            position: relative;
        }

        .form-input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            width: 16px;
            height: 16px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(0, 212, 255, 0.06);
            border: 1.5px solid var(--border);
            border-radius: 11px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .form-input::placeholder {
            color: #475569;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.15);
        }

        .form-error {
            padding: 11px 14px;
            border-radius: 9px;
            background: rgba(255, 40, 120, 0.12);
            border: 1px solid rgba(255, 40, 120, 0.3);
            color: var(--accent3);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .btn-submit {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #000;
            box-shadow: 0 0 24px rgba(0, 212, 255, 0.3);
        }

        .btn-submit:hover:not(:disabled) {
            box-shadow: 0 0 36px rgba(0, 212, 255, 0.4);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background: var(--border);
            color: var(--muted);
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2.5px solid rgba(0, 212, 255, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ═══════════════════════════════════════════════════════════════════ */
        /* CONTENEDOR IFRAME */
        /* ═══════════════════════════════════════════════════════════════════ */
        .container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .iframe-wrapper {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none;
        }

        .iframe-wrapper.active {
            pointer-events: auto;
            animation: content-reveal 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: auto;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 0 20px;
            }

            .header-title {
                font-size: 11px;
            }

            .btn-back {
                font-size: 11px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- FONDO -->
    <div class="bg-anim"></div>

    <!-- TRANSICIÓN ELEGANTE -->
    <div class="transition-state" id="transitionState">
        <div class="blur-background"></div>
        <div class="transition-lines">
            <div class="line line-h"></div>
            <div class="line line-v"></div>
        </div>
        <div class="orb"></div>
        <div class="corner-accent top-left"></div>
        <div class="corner-accent top-right"></div>
        <div class="corner-accent bottom-left"></div>
        <div class="corner-accent bottom-right"></div>
        <div class="transition-text">
            <h3 class="transition-title">Cargando tu curso...</h3>
            <p class="transition-subtitle">Preparando contenido exclusivo</p>
        </div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <span>🚀</span>
            Sergio Murillo
        </div>
        <div class="header-right">
            <span class="header-title">Context Engineering - Curso</span>
            <button class="btn-consultas" onclick="openConsultasModal()">Consultas</button>
            <button class="btn-back" onclick="goBack()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Atrás
            </button>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">
        <div class="iframe-wrapper" id="iframeWrapper">
            <iframe id="courseIframe"></iframe>
        </div>
    </div>

    <!-- MODAL DE CONSULTAS -->
    <div class="modal-overlay" id="consultasModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">¿Tienes una consulta?</h3>
                <button class="btn-close" onclick="closeConsultasModal()">×</button>
            </div>

            <form id="consultasForm" onsubmit="submitConsultasForm(event)">
                <div class="form-group">
                    <label class="form-label">Nombre completo</label>
                    <div class="form-input-wrapper">
                        <svg class="form-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <input type="text" class="form-input" name="nombre" placeholder="Tu nombre" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Teléfono</label>
                    <div class="form-input-wrapper">
                        <svg class="form-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                        </svg>
                        <input type="tel" class="form-input" name="phone" placeholder="+54 9 11 0000 0000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div class="form-input-wrapper">
                        <svg class="form-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                        <input type="email" class="form-input" name="email" placeholder="tu@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Tu consulta</label>
                    <textarea class="form-input" name="consulta" placeholder="Cuéntanos tu pregunta..." required style="resize: vertical; min-height: 110px; font-family: inherit;"></textarea>
                </div>

                <div id="consultasError"></div>
                <div id="consultasSuccess" style="display: none; padding: 11px 14px; border-radius: 9px; background: rgba(0, 212, 255, 0.12); border: 1px solid rgba(0, 212, 255, 0.3); color: var(--accent); text-align: center; margin-bottom: 10px;">✅ Mensaje enviado correctamente</div>

                <button type="submit" class="btn-submit" id="consultasSubmitBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Enviar Consulta
                </button>
            </form>
        </div>
    </div>

    <script>
        // ═════════════════════════════════════════════════════════════════════
        // TRANSICIÓN Y CARGA DEL IFRAME
        // ═════════════════════════════════════════════════════════════════════
        
        console.log('📄 Artefacto.html cargado');

        // Esperar a que la página esté lista
        window.addEventListener('load', () => {
            console.log('🎬 Iniciando transición elegante...');
            
            // La transición dura 3 segundos
            setTimeout(() => {
                console.log('🌀 Fade out de transición...');
                const transitionState = document.getElementById('transitionState');
                transitionState.classList.add('fade-out');

                // Después de 0.8 segundos del fade out (total 3.8s)
                setTimeout(() => {
                    console.log('✅ Cargando iframe...');
                    
                    // Cargar el iframe
                    const iframe = document.getElementById('courseIframe');
                    iframe.src = 'https://claude.site/public/artifacts/15103044-13b3-4fc0-875b-88dea240e50e/embed';
                    
                    // Mostrar el iframe
                    const iframeWrapper = document.getElementById('iframeWrapper');
                    iframeWrapper.classList.add('active');
                    
                    // Ocultar la transición
                    transitionState.classList.add('hidden');
                    
                    console.log('🎯 Iframe cargado y visible!');
                }, 800);
            }, 3000);
        });

        // ═════════════════════════════════════════════════════════════════════
        // NAVEGACIÓN
        // ═════════════════════════════════════════════════════════════════════
        function goBack() {
            console.log('← Volviendo a index.html');
            window.location.href = 'index.html';
        }

        // Prevenir que se vaya atrás si se presiona el botón de atrás del navegador
        window.addEventListener('beforeunload', (e) => {
            // Esto es opcional, pero útil para advertir al usuario
            // e.preventDefault();
            // e.returnValue = '';
        });

        // ═════════════════════════════════════════════════════════════════════
        // MODAL DE CONSULTAS
        // ═════════════════════════════════════════════════════════════════════
        const modal = document.getElementById('consultasModal');
        const consultasForm = document.getElementById('consultasForm');
        const consultasSubmitBtn = document.getElementById('consultasSubmitBtn');
        const consultasError = document.getElementById('consultasError');
        const consultasSuccess = document.getElementById('consultasSuccess');

        function openConsultasModal() {
            modal.classList.add('active');
        }

        function closeConsultasModal() {
            modal.classList.remove('active');
            consultasForm.reset();
            consultasError.innerHTML = '';
            consultasSuccess.style.display = 'none';
        }

        function submitConsultasForm(e) {
            e.preventDefault();

            const formData = new FormData(consultasForm);
            const data = {
                nombre: formData.get('nombre'),
                phone: formData.get('phone'),
                email: formData.get('email'),
                consulta: formData.get('consulta'),
                formulario: 'consulta'
            };

            if (!data.nombre || !data.phone || !data.email || !data.consulta) {
                showConsultasError('Por favor completa todos los campos');
                return;
            }

            consultasSubmitBtn.disabled = true;
            const originalText = consultasSubmitBtn.innerHTML;
            consultasSubmitBtn.innerHTML = '<div class="spinner"></div> Enviando...';

            fetch('https://webhook.inteliautomake.com/webhook-test/57912251-39f5-4b3e-86fa-85de26b1c7b6', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(res => {
                    if (res.ok) {
                        showConsultasSuccess();
                        setTimeout(closeConsultasModal, 1500);
                    } else {
                        sendConsultasWithBeacon(data);
                    }
                    consultasSubmitBtn.disabled = false;
                    consultasSubmitBtn.innerHTML = originalText;
                })
                .catch(err => {
                    sendConsultasWithBeacon(data);
                    consultasSubmitBtn.disabled = false;
                    consultasSubmitBtn.innerHTML = originalText;
                });
        }

        function sendConsultasWithBeacon(data) {
            try {
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const success = navigator.sendBeacon(
                    'https://webhook.inteliautomake.com/webhook-test/57912251-39f5-4b3e-86fa-85de26b1c7b6',
                    blob
                );
                if (success) {
                    showConsultasSuccess();
                    setTimeout(closeConsultasModal, 1500);
                    console.log('✅ Consulta enviada con Beacon API');
                } else {
                    showConsultasError('Error de conexión');
                }
            } catch (err) {
                showConsultasError('Error de conexión');
            }
        }

        function showConsultasError(msg) {
            consultasError.innerHTML = `<div class="form-error">${msg}</div>`;
            consultasSuccess.style.display = 'none';
        }

        function showConsultasSuccess() {
            consultasError.innerHTML = '';
            consultasSuccess.style.display = 'block';
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeConsultasModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeConsultasModal();
            }
        });
    </script>
</body>
</html>
